services:
  - type: web
    name: smartpark-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: CONFIDENCE_THRESHOLD
        value: 0.5
      - key: KERAS_HOME
        value: /tmp/.keras
      - key: MPLCONFIGDIR
        value: /tmp/.matplotlib

  - type: web
    name: smartpark-dashboard
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app/streamlit_app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: API_BASE
        fromService:
          type: web
          name: smartpark-api
          property: url
      - key: KERAS_HOME
        value: /tmp/.keras
      - key: MPLCONFIGDIR
        value: /tmp/.matplotlib

