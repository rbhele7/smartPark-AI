version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartpark-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - CONFIDENCE_THRESHOLD=0.5
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: smartpark-streamlit
    ports:
      - "8501:8501"
    environment:
      - API_BASE=http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
